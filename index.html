<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>AUNG SMART BUSINESS ERP</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#f3f4f6;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
  --primary:#111827;
  --primary2:#1f2937;
  --success:#059669;
  --warning:#d97706;
  --danger:#dc2626;
  --info:#2563eb;
  --sidebar:260px;
  --radius:16px;
}
html,body{margin:0;padding:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Myanmar",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top right,#374151 0,#111827 45%,#030712 100%);
}
.login-box{
  width:min(430px,100%);
  background:#fff;
  border-radius:24px;
  padding:30px;
  box-shadow:0 30px 80px rgba(0,0,0,.3);
}
.brand{text-align:center;margin-bottom:25px}
.brand-mark{
  width:62px;height:62px;border-radius:18px;
  background:#111827;color:#fff;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 15px;font-weight:900;font-size:22px;
}
.brand h1{font-size:22px;margin:0 0 5px}
.brand p{margin:0;color:var(--muted);font-size:13px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
input,select,textarea{
  width:100%;
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  border-radius:11px;
  padding:12px 13px;
  outline:none;
}
input:focus,select:focus,textarea:focus{border-color:#6b7280;box-shadow:0 0 0 3px rgba(107,114,128,.12)}
textarea{min-height:100px;resize:vertical}

.btn{
  border:0;border-radius:11px;padding:11px 15px;
  font-weight:750;display:inline-flex;align-items:center;
  justify-content:center;gap:7px;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:#f3f4f6;color:#111827;border:1px solid var(--border)}
.btn-success{background:#059669;color:#fff}
.btn-warning{background:#d97706;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-info{background:#2563eb;color:#fff}
.btn-full{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}

.login-switch{
  text-align:center;margin-top:18px;font-size:13px;color:var(--muted)
}
.login-switch button{
  border:0;background:none;color:#111827;font-weight:800
}
.login-msg{
  min-height:20px;margin:10px 0;text-align:center;
  font-size:13px;font-weight:700
}

.app{min-height:100vh}
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);
  background:#111827;color:#fff;padding:18px 12px;z-index:50;
  overflow-y:auto;
}
.logo{
  padding:10px 12px 20px;border-bottom:1px solid rgba(255,255,255,.1);
  margin-bottom:12px
}
.logo strong{display:block;font-size:17px}
.logo span{font-size:11px;color:#9ca3af}
.nav-section{
  color:#6b7280;font-size:10px;font-weight:900;
  padding:13px 12px 6px;text-transform:uppercase
}
.nav-btn{
  width:100%;border:0;background:transparent;color:#d1d5db;
  padding:11px 12px;border-radius:10px;text-align:left;
  display:flex;align-items:center;gap:10px;font-size:13px;
  margin:2px 0
}
.nav-btn:hover,.nav-btn.active{background:#1f2937;color:#fff}
.nav-icon{width:22px;text-align:center}
.logout{margin-top:15px;color:#fca5a5}

.main{
  margin-left:var(--sidebar);
  min-height:100vh;
}
.topbar{
  position:sticky;top:0;z-index:30;
  height:68px;background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;
}
.top-left{display:flex;align-items:center;gap:12px}
.menu-toggle{
  display:none;border:0;background:#f3f4f6;border-radius:10px;
  width:40px;height:40px
}
.page-title{font-weight:850;font-size:18px}
.top-user{font-size:12px;color:var(--muted)}
.content{padding:24px;max-width:1500px;margin:auto}

.welcome{
  background:#111827;color:#fff;border-radius:20px;
  padding:24px;margin-bottom:20px;
}
.welcome h2{margin:0 0 7px;font-size:23px}
.welcome p{margin:0;color:#d1d5db;font-size:13px}

.cards{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:14px;margin-bottom:20px
}
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px
}
.stat-label{font-size:12px;color:var(--muted);font-weight:700}
.stat-value{font-size:25px;font-weight:900;margin-top:8px}
.stat-sub{font-size:11px;color:var(--muted);margin-top:5px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

.section-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:15px
}
.section-head h3{margin:0;font-size:17px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.table-wrap{
  overflow:auto;border:1px solid var(--border);border-radius:13px
}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:12px 13px;border-bottom:1px solid var(--border);text-align:left;font-size:12px}
th{background:#f9fafb;color:#4b5563;font-weight:800}
tr:last-child td{border-bottom:0}

.badge{
  display:inline-flex;padding:5px 8px;border-radius:999px;
  font-size:10px;font-weight:800
}
.badge-success{background:#d1fae5;color:#065f46}
.badge-warning{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-info{background:#dbeafe;color:#1e40af}

.product-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px
}
.product-card{
  background:#fff;border:1px solid var(--border);
  border-radius:15px;overflow:hidden
}
.product-img{
  height:155px;background:#f3f4f6;
  display:flex;align-items:center;justify-content:center;
  color:#9ca3af;font-size:40px;overflow:hidden
}
.product-img img{width:100%;height:100%;object-fit:cover}
.product-body{padding:14px}
.product-name{font-weight:850;margin-bottom:4px}
.product-meta{font-size:11px;color:var(--muted);margin-bottom:10px}
.price{font-weight:900;font-size:17px}
.stock{font-size:11px;color:var(--muted);margin-top:5px}

.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:100;display:flex;align-items:center;justify-content:center;
  padding:15px
}
.modal-box{
  width:min(650px,100%);max-height:92vh;overflow:auto;
  background:#fff;border-radius:20px;padding:22px
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px
}
.modal-head h3{margin:0}
.close{
  width:35px;height:35px;border:0;border-radius:9px;
  background:#f3f4f6;font-size:18px
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-full{grid-column:1/-1}

.search{
  max-width:330px
}

.empty{
  text-align:center;padding:35px 15px;color:var(--muted);
  font-size:13px
}
.loading{text-align:center;padding:30px;color:var(--muted)}
.error-box{
  padding:12px 14px;border-radius:11px;background:#fee2e2;
  color:#991b1b;font-size:12px;margin-bottom:15px
}
.success-box{
  padding:12px 14px;border-radius:11px;background:#d1fae5;
  color:#065f46;font-size:12px;margin-bottom:15px
}

.growth-stage{
  border-left:4px solid #111827;padding:15px;
  background:#fff;border:1px solid var(--border);
  border-left-width:4px;border-radius:12px;margin-bottom:10px
}
.growth-stage strong{display:block;margin-bottom:5px}
.growth-stage span{font-size:12px;color:var(--muted)}

.tool-card{
  cursor:pointer;transition:.15s
}
.tool-card:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.07)}
.tool-icon{font-size:25px;margin-bottom:10px}
.tool-card h4{margin:0 0 5px}
.tool-card p{margin:0;font-size:12px;color:var(--muted)}

.overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
  z-index:45
}

@media(max-width:1100px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .product-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:800px){
  .sidebar{
    transform:translateX(-100%);
    transition:.2s
  }
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .menu-toggle{display:block}
  .overlay.show{display:block}
  .content{padding:15px}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .product-grid{grid-template-columns:repeat(2,1fr)}
  .topbar{padding:0 15px}
}
@media(max-width:520px){
  .cards{grid-template-columns:1fr 1fr;gap:10px}
  .card{padding:14px}
  .stat-value{font-size:20px}
  .product-grid{grid-template-columns:1fr 1fr;gap:10px}
  .product-img{height:120px}
  .form-grid{grid-template-columns:1fr}
  .form-full{grid-column:auto}
  .login-box{padding:22px}
}
</style>
</head>

<script>
/* =========================================================
   AUNG SMART BUSINESS ERP V5 CLOUD FRONTEND
   ========================================================= */

const API_BASE = "https://aung-smart-business.onrender.com";

const TOKEN_KEY = "aung_smart_business_token";
const USER_KEY = "aung_smart_business_user";
const PRODUCT_IMAGE_KEY = "aung_smart_business_product_images";

let currentUser = null;
let currentPage = "dashboard";
let dashboardData = null;
let customers = [];
let suppliers = [];
let products = [];
let sales = [];
let purchases = [];
let expenses = [];
let employees = [];
let users = [];

let selectedProductImage = "";
let productImages = JSON.parse(
  localStorage.getItem(PRODUCT_IMAGE_KEY) || "{}"
);

const $ = id => document.getElementById(id);

function money(value){
  const n = Number(value || 0);
  return new Intl.NumberFormat("en-US",{
    maximumFractionDigits:2
  }).format(n);
}

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function show(id){
  $(id)?.classList.remove("hidden");
}

function hide(id){
  $(id)?.classList.add("hidden");
}

function setMsg(id,message,type=""){
  const el=$(id);
  if(!el)return;
  el.textContent=message;
  el.style.color =
    type==="error" ? "#dc2626" :
    type==="success" ? "#059669" :
    "#6b7280";
}

async function api(path,options={}){
  const token=localStorage.getItem(TOKEN_KEY);

  const headers={
    "Content-Type":"application/json",
    ...(options.headers||{})
  };

  if(token){
    headers.Authorization="Bearer "+token;
  }

  let response;

  try{
    response=await fetch(API_BASE+path,{
      ...options,
      headers
    });
  }catch(error){
    throw new Error(
      "Backend ကို ချိတ်မရပါ — Render service URL သို့မဟုတ် Network ကို စစ်ပါ"
    );
  }

  const text=await response.text();

  let data={};

  try{
    data=text ? JSON.parse(text) : {};
  }catch{
    data={message:text};
  }

  if(!response.ok){
    if(response.status===401){
      logout();
    }

    throw new Error(
      data.message ||
      data.error ||
      "Request failed ("+response.status+")"
    );
  }

  return data;
}

/* =========================================================
   AUTH
   ========================================================= */

function showRegister(){
  hide("loginForm");
  show("registerForm");
  setMsg("registerMsg","");
}

function showLogin(){
  show("loginForm");
  hide("registerForm");
  setMsg("loginMsg","");
}

async function login(){

  const email=$("loginEmail").value.trim();
  const password=$("loginPassword").value;

  if(!email || !password){
    setMsg("loginMsg","Email နှင့် Password ထည့်ပါ","error");
    return;
  }

  setMsg("loginMsg","Signing in...");

  try{

    const data=await api("/api/auth/login",{
      method:"POST",
      body:JSON.stringify({
        email,
        password
      })
    });

    localStorage.setItem(TOKEN_KEY,data.token);

    if(data.user){
      localStorage.setItem(USER_KEY,JSON.stringify(data.user));
      currentUser=data.user;
    }

    await startApp();

  }catch(error){
    setMsg("loginMsg",error.message,"error");
  }
}

async function register(){

  const name=$("regName").value.trim();
  const company=$("regCompany").value.trim();
  const email=$("regEmail").value.trim();
  const password=$("regPassword").value;

  if(!name || !company || !email || !password){
    setMsg("registerMsg","လိုအပ်တဲ့အချက်အလက်အားလုံးထည့်ပါ","error");
    return;
  }

  if(password.length<6){
    setMsg("registerMsg","Password အနည်းဆုံး 6 characters ထည့်ပါ","error");
    return;
  }

  setMsg("registerMsg","Creating account...");

  try{

    const data=await api("/api/auth/register",{
      method:"POST",
      body:JSON.stringify({
        name,
        company,
        email,
        password
      })
    });

    localStorage.setItem(TOKEN_KEY,data.token);

    if(data.user){
      localStorage.setItem(USER_KEY,JSON.stringify(data.user));
      currentUser=data.user;
    }

    await startApp();

  }catch(error){
    setMsg("registerMsg",error.message,"error");
  }
}

async function startApp(){

  hide("loginScreen");
  show("app");

  try{
    const me=await api("/api/auth/me");

    if(me.user){
      currentUser=me.user;
      localStorage.setItem(USER_KEY,JSON.stringify(me.user));
    }
  }catch(error){
    console.error(error);
  }

  $("topUser").textContent=
    currentUser ?
    `${currentUser.name || currentUser.email} • ${currentUser.role || "User"}` :
    "";

  go("dashboard");
}

function logout(){

  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(USER_KEY);

  currentUser=null;

  hide("app");
  show("loginScreen");

  showLogin();

  $("loginEmail").value="";
  $("loginPassword").value="";
}

function previewProductImage(event){

  const file=event.target.files?.[0];

  if(!file)return;

  if(file.size>8*1024*1024){
    alert("Image size 8MB အောက်ဖြစ်ရပါမယ်");
    event.target.value="";
    return;
  }

  const reader=new FileReader();

  reader.onload=()=>{
    const img=new Image();

    img.onload=()=>{

      const max=700;

      let w=img.width;
      let h=img.height;

      if(w>max || h>max){
        const ratio=Math.min(max/w,max/h);
        w=Math.round(w*ratio);
        h=Math.round(h*ratio);
      }

      const canvas=document.createElement("canvas");
      canvas.width=w;
      canvas.height=h;

      const ctx=canvas.getContext("2d");

      ctx.drawImage(img,0,0,w,h);

      selectedProductImage=
        canvas.toDataURL("image/jpeg",.72);

      $("imagePreview").innerHTML=
        `<img src="${selectedProductImage}" alt="Preview">`;
    };

    img.src=reader.result;
  };

  reader.readAsDataURL(file);
}

async function saveProduct(){

  if(!name){
    alert("Product Name ထည့်ပါ");

  const productId=$("productId").value;

  /*
    Current V5 backend has POST /api/products
    but no product PATCH endpoint yet

    Therefore new products are saved to cloud API
    Product image remains browser-local for now
  */

  if(productId){
    alert(
      "Product Edit API ကို Backend V5 မှာ မထည့်ရသေးပါ\n"+
      "အခု Add Product ကို အရင်အသုံးပြုနိုင်ပါတယ်"
    );
    return;
  }

  const payload={
    name,
    sku:$("productSku").value.trim(),
    category:$("productCategory").value.trim(),
    unit:$("productUnit").value,
    cost_price:Number($("productCost").value||0),
    selling_price:Number($("productPrice").value||0),
    stock:Number($("productStock").value||0),
    low_stock:Number($("productLowStock").value||10),
    active:true
  };

  try{

    const data=await api("/api/products",{
      method:"POST",
      body:JSON.stringify(payload)
    });

    const saved=data.product || data;

    if(saved?.id && selectedProductImage){
      productImages[saved.id]=selectedProductImage;

      localStorage.setItem(
        PRODUCT_IMAGE_KEY,
        JSON.stringify(productImages)
      );
    }

    closeProductModal();

    await renderInventory();

    alert("Product saved successfully");

  }catch(error){
    alert(error.message);
  }
}

      option.dataset.price || 0;

  calculateSaleTotal();

function calculateSaleTotal(){

  const qty=Number($("saleQty")?.value||0);
  const price=Number($("salePrice")?.value||0);

  if($("saleTotal")){
    $("saleTotal").value=money(qty*price);
  }
}

async function createSale(){

  const product_id=$("saleProduct").value;
  const customer_id=$("saleCustomer").value || null;
  const qty=Number($("saleQty").value||0);
  const price=Number($("salePrice").value||0);
  const payment_status=$("salePayment").value;

  if(!product_id || qty<=0 || price<0){
    alert("Product, Quantity နှင့် Price စစ်ပါ");
    return;

  try{

    await api("/api/sales",{
      method:"POST",
      body:JSON.stringify({
        customer_id,
        product_id,
        qty,
        price,
        payment_status,
        paid_amount:
          payment_status==="Paid"
          ? qty*price
          : 0,
        salesperson:
          currentUser?.name || ""
      })
    });

    alert("Invoice created successfully");

    go("sales");

  }catch(error){

    $("saleMsg").innerHTML=`
      <div class="error-box">${esc(error.message)}</div>

}

async function createExpense(){

  const amount=Number($("expenseAmount").value||0);

  if(amount<=0){
    alert("Amount ထည့်ပါ");
    return;
  }

  try{

    await api("/api/expenses",{
      method:"POST",
      body:JSON.stringify({
        category:$("expenseCategory").value,
        amount,
        payment_method:$("expenseMethod").value,
        expense_date:$("expenseDate").value,
        description:$("expenseDescription").value.trim()
      })
    });

    alert("Expense saved");

    go("expenses");

  }catch(error){
    alert(error.message);
  }
}

function calculateGrowth(){

  const current=Number($("growthCurrent").value||0);
  const target=Number($("growthTarget").value||0);

  if(current<=0 || target<=0){
    $("growthPercent").value="";
    return;
  }

  const growth=((target-current)/current)*100;

  $("growthPercent").value=
    growth.toFixed(1)+"%";
}

function openTool(type){

          onclick="renderTools()">

        <div class="field">
          <label>Revenue</label>
          <input id="tRevenue" type="number">
        </div>

          <label>Total Cost</label>

        ">
        Calculate
      </button>

      <div id="toolResult" style="margin-top:15px"></div>
    `;

  }

  if(type==="margin"){

    body.innerHTML=`

      <div class="form-grid">

        <div class="field">
          <label>Selling Price</label>
          <input id="tSell" type="number">
        </div>

        <div class="field">
          <label>Cost Price</label>
          <input id="tCost" type="number">
        </div>

      </div>

      <button class="btn btn-primary"
        onclick="
          const s=Number(tSell.value||0);
          const c=Number(tCost.value||0);
          const m=s ? ((s-c)/s)*100 : 0;
          toolResult('Gross Margin = '+m.toFixed(2)+'%');
        ">
        Calculate
      </button>

      <div id="toolResult" style="margin-top:15px"></div>
    `;
  }

  if(type==="pricing"){

    body.innerHTML=`

      <div class="form-grid">

        <div class="field">
          <label>Cost Price</label>
          <input id="tCost" type="number">
        </div>

        <div class="field">
          <label>Target Margin %</label>
          <input id="tMargin" type="number" value="30">
        </div>

      </div>

      <button class="btn btn-primary"
        onclick="
          const c=Number(tCost.value||0);
          const m=Number(tMargin.value||0);
          const p=m<100 ? c/(1-m/100) : 0;
          toolResult('Recommended Selling Price = '+money(p));
        ">
        Calculate
      </button>

      <div id="toolResult" style="margin-top:15px"></div>
    `;
  }

  if(type==="discount"){

    body.innerHTML=`

      <div class="form-grid">

        <div class="field">
          <label>Original Price</label>
          <input id="tPrice" type="number">
        </div>

        <div class="field">
          <label>Discount %</label>
          <input id="tDiscount" type="number" value="10">
        </div>

      </div>

      <button class="btn btn-primary"
        onclick="
          const p=Number(tPrice.value||0);
          const d=Number(tDiscount.value||0);
          const finalPrice=p-(p*d/100);
          toolResult('Final Price = '+money(finalPrice));
        ">
        Calculate
      </button>

      <div id="toolResult" style="margin-top:15px"></div>
    `;
  }

  if(type==="breakeven"){

    body.innerHTML=`

      <div class="form-grid">

        <div class="field">
          <label>Fixed Cost</label>
          <input id="tFixed" type="number">
        </div>

        <div class="field">
          <label>Selling Price / Unit</label>
          <input id="tSell" type="number">
        </div>

        <div class="field">
          <label>Variable Cost / Unit</label>
          <input id="tVariable" type="number">
        </div>

      </div>

      <button class="btn btn-primary"
        onclick="
          const f=Number(tFixed.value||0);
          const s=Number(tSell.value||0);
          const v=Number(tVariable.value||0);
          const q=(s-v)>0 ? f/(s-v) : 0;
          toolResult('Break-even Units = '+money(q));
        ">
        Calculate
      </button>

      <div id="toolResult" style="margin-top:15px"></div>
    `;
  }

  if(type==="aov"){

    body.innerHTML=`

      <div class="form-grid">

        <div class="field">
          <label>Total Revenue</label>
          <input id="tRevenue" type="number">
        </div>

        <div class="field">
          <label>Total Orders</label>
          <input id="tOrders" type="number">
        </div>

      </div>

      <button class="btn btn-primary"
        onclick="
          const r=Number(tRevenue.value||0);
          const o=Number(tOrders.value||0);
          toolResult('AOV = '+money(o ? r/o : 0));
        ">
        Calculate
      </button>

      <div id="toolResult" style="margin-top:15px"></div>
    `;
  }
}

function toolResult(text){

  $("toolResult").innerHTML=`
    <div class="success-box">
      <strong>${esc(text)}</strong>
    </div>
  `;
}

              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
              </tr>
            </thead>

            <tbody>
              ${users.map(u=>`
                <tr>
                  <td><strong>${esc(u.name)}</strong></td>
                  <td>${esc(u.email)}</td>
                  <td>
                    <span class="badge badge-info">
                      ${esc(u.role)}
                    </span>
                  </td>
                  <td>${esc(u.status)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
        `
        :
        `<div class="empty">No users found</div>`
      }

    </div>
  `;
}

/* =========================================================
   SETTINGS
   ========================================================= */

async function renderSettings(){

  let company={};

  try{
    const data=await api("/api/company");
    company=data.company || data || {};
  }catch(error){
    console.error(error);
  }

  $("content").innerHTML=`

    <div class="grid-2">

      <div class="card">

        <div class="section-head">
          <h3>Company Settings</h3>
        </div>

        <div class="field">
          <label>Company Name</label>
          <input id="setCompany"
            value="${esc(company.name || company.company || "")}">
        </div>

        <div class="field">
          <label>Owner</label>
          <input id="setOwner"
            value="${esc(company.owner || currentUser?.name || "")}">
        </div>

        <div class="field">
          <label>Currency</label>
          <select id="setCurrency">
            <option value="MMK">MMK</option>
            <option value="USD">USD</option>
            <option value="THB">THB</option>
          </select>
        </div>

        <button class="btn btn-primary"
          onclick="saveCompanySettings()">
          Save Settings
        </button>

      </div>

      <div class="card">

        <h3>Account</h3>

        <p style="font-size:13px">
          <strong>Name:</strong>
          ${esc(currentUser?.name)}
        </p>

        <p style="font-size:13px">
          <strong>Email:</strong>
          ${esc(currentUser?.email)}
        </p>

        <p style="font-size:13px">
          <strong>Role:</strong>
          ${esc(currentUser?.role)}
        </p>

        <div class="success-box">
          Connected to AUNG SMART BUSINESS ERP V5 Cloud API
        </div>

        <button class="btn btn-danger"
          onclick="logout()">
          Logout
        </button>

      </div>

    </div>

  `;
}

async function saveCompanySettings(){

  try{

    await api("/api/company",{
      method:"PUT",
      body:JSON.stringify({
        name:$("setCompany").value.trim(),
        owner:$("setOwner").value.trim(),
        currency:$("setCurrency").value
      })
    });

    alert("Company settings saved");

  }catch(error){
    alert(error.message);
  }
}

/* =========================================================
   STARTUP
   ========================================================= */

(async function(){

  const token=localStorage.getItem(TOKEN_KEY);

  if(!token){
    show("loginScreen");
    hide("app");
    return;
  }

  try{

    const me=await api("/api/auth/me");

    currentUser=me.user || null;

    if(currentUser){
      localStorage.setItem(
        USER_KEY,
        JSON.stringify(currentUser)
      );
    }

    await startApp();

  }catch(error){

    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);

    show("loginScreen");
    hide("app");
  }

})();
</script>
