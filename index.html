<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AUNG SMART BUSINESS ERP V5</title>

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#17202a;
  --muted:#6b7280;
  --line:#e5e7eb;
  --primary:#111827;
  --accent:#16a34a;
  --danger:#dc2626;
  --warning:#d97706;
  --sidebar:260px;
  --radius:16px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at top right,#dbeafe 0,transparent 35%),
    linear-gradient(135deg,#f8fafc,#eef2f7);
}

.login-card{
  width:100%;
  max-width:430px;
  background:#fff;
  padding:32px;
  border-radius:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.08);
}

.brand{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.5px;
}

.brand-sub{
  color:var(--muted);
  margin-top:6px;
  margin-bottom:28px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px 13px;
  outline:none;
  background:#fff;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#111827;
  box-shadow:0 0 0 3px rgba(17,24,39,.06);
}

.btn{
  border:0;
  border-radius:11px;
  padding:11px 15px;
  font-weight:700;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:#111827;
  color:#fff;
}

.btn-success{
  background:#16a34a;
  color:#fff;
}

.btn-danger{
  background:#dc2626;
  color:#fff;
}

.btn-light{
  background:#f3f4f6;
  color:#111827;
}

.btn-block{
  width:100%;
}

.message{
  margin-top:12px;
  padding:10px 12px;
  border-radius:10px;
  font-size:13px;
}

.message.error{
  background:#fef2f2;
  color:#b91c1c;
}

.message.success{
  background:#f0fdf4;
  color:#15803d;
}

/* APP */

.app{
  min-height:100vh;
}

.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:var(--sidebar);
  background:#111827;
  color:#fff;
  padding:20px 14px;
  z-index:50;
  overflow-y:auto;
}

.sidebar-brand{
  padding:10px 12px 24px;
  border-bottom:1px solid rgba(255,255,255,.08);
  margin-bottom:15px;
}

.sidebar-brand strong{
  display:block;
  font-size:17px;
}

.sidebar-brand span{
  color:#9ca3af;
  font-size:11px;
}

.nav-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  background:transparent;
  color:#cbd5e1;
  border:0;
  padding:11px 12px;
  border-radius:10px;
  text-align:left;
  margin:3px 0;
}

.nav-item:hover{
  background:#1f2937;
  color:#fff;
}

.nav-item.active{
  background:#fff;
  color:#111827;
}

.main{
  margin-left:var(--sidebar);
  min-height:100vh;
}

.topbar{
  height:70px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:20;
}

.menu-btn{
  display:none;
  border:0;
  background:#f3f4f6;
  border-radius:10px;
  width:42px;
  height:42px;
}

.user-box{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#111827;
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:800;
}

.content{
  padding:25px;
  max-width:1500px;
  margin:auto;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:22px;
}

.page-title{
  margin:0;
  font-size:27px;
  letter-spacing:-.8px;
}

.page-sub{
  color:var(--muted);
  margin-top:5px;
  font-size:14px;
}

/* DASHBOARD */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
}

.stat-value{
  font-size:25px;
  font-weight:800;
  margin-top:8px;
}

/* CARD */

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:20px;
}

.card-title{
  font-size:16px;
  font-weight:800;
  margin-bottom:15px;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.search{
  flex:1;
  min-width:220px;
  border:1px solid var(--line);
  border-radius:11px;
  padding:11px 13px;
}

/* PRODUCT */

.product-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.product-card{
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  background:#fff;
  transition:.2s;
}

.product-card:hover{
  box-shadow:0 10px 30px rgba(0,0,0,.07);
  transform:translateY(-2px);
}

.product-image{
  width:100%;
  height:190px;
  object-fit:cover;
  background:#f3f4f6;
  display:block;
}

.product-image.empty{
  display:grid;
  place-items:center;
  color:#9ca3af;
  font-size:45px;
}

.product-body{
  padding:15px;
}

.product-name{
  font-weight:800;
  font-size:16px;
}

.product-sku{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.product-meta{
  display:flex;
  justify-content:space-between;
  margin-top:13px;
  gap:8px;
}

.product-price{
  font-weight:800;
}

.stock{
  font-size:12px;
  padding:5px 8px;
  border-radius:20px;
  background:#ecfdf5;
  color:#15803d;
}

.stock.low{
  background:#fff7ed;
  color:#c2410c;
}

.product-actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.product-actions .btn{
  flex:1;
  padding:8px;
  font-size:12px;
}

/* TABLE */

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,td{
  text-align:left;
  padding:12px 10px;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

th{
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}

.badge.green{
  background:#ecfdf5;
  color:#15803d;
}

.badge.orange{
  background:#fff7ed;
  color:#c2410c;
}

.badge.red{
  background:#fef2f2;
  color:#b91c1c;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal-card{
  width:100%;
  max-width:720px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:23px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-title{
  font-size:20px;
  font-weight:800;
}

.close{
  width:36px;
  height:36px;
  border:0;
  border-radius:10px;
  background:#f3f4f6;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.full{
  grid-column:1/-1;
}

.image-upload{
  border:2px dashed #d1d5db;
  border-radius:15px;
  padding:18px;
  text-align:center;
}

.image-preview{
  width:180px;
  height:180px;
  margin:0 auto 15px;
  object-fit:cover;
  border-radius:14px;
  background:#f3f4f6;
  display:block;
}

.image-preview.empty{
  display:grid;
  place-items:center;
  font-size:50px;
  color:#9ca3af;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:22px;
}

/* OVERLAY */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  z-index:40;
}

.overlay.show{
  display:block;
}

/* TOAST */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:200;
  background:#111827;
  color:#fff;
  padding:13px 17px;
  border-radius:11px;
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* RESPONSIVE */

@media(max-width:1100px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .product-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:800px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
  }

  .menu-btn{
    display:block;
  }

  .topbar{
    padding:0 15px;
  }

  .content{
    padding:17px;
  }

  .product-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }
}

@media(max-width:520px){
  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat{
    padding:14px;
  }

  .stat-value{
    font-size:19px;
  }

  .product-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .product-image{
    height:135px;
  }

  .product-body{
    padding:11px;
  }

  .page-title{
    font-size:22px;
  }

  .modal{
    padding:10px;
  }

  .modal-card{
    padding:17px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="brand">AUNG SMART BUSINESS</div>
    <div class="brand-sub">ERP • Business Growth Operating System</div>

    <div class="field">
      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="owner@example.com">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="Password">
    </div>

    <button class="btn btn-primary btn-block" onclick="login()">

    <button class="btn btn-light btn-block" style="margin-top:9px" onclick="showRegister()">

    </button>

  </div>
</section>


<!-- APP -->

<section id="app" class="app hidden">

  <aside id="sidebar" class="sidebar">

    <div class="sidebar-brand">
      <strong>AUNG SMART BUSINESS</strong>

    </button>

    <button class="nav-item" onclick="navigate('sales',this)">

    </button>

    <button class="nav-item" onclick="navigate('purchases',this)">
      🛒 Purchases
    </button>

    <button class="nav-item" onclick="navigate('inventory',this)">
      📦 Inventory
    </button>

    <button class="nav-item" onclick="navigate('accounting',this)">
      💰 Accounting
    </button>

    <button class="nav-item" onclick="navigate('expenses',this)">
      💳 Expenses
    </button>

    <button class="nav-item" onclick="navigate('employees',this)">

    </button>

    </button>

    </button>

<!-- REGISTER MODAL -->

<div id="registerModal" class="modal hidden">
  <div class="modal-card" style="max-width:500px">

    <div class="modal-head">

<!-- PRODUCT MODAL -->

  <div class="modal-card">

        Cancel

        Save Product
      </button>

<div id="toast" class="toast"></div>


<script>
const API_BASE =
  localStorage.getItem("aung_erp_api") ||
  "https://YOUR-ERP-BACKEND.onrender.com";

const TOKEN_KEY = "aung_smart_business_token";
const IMAGE_KEY = "aung_smart_business_product_images";

let currentUser = null;
let productsCache = [];
let editingProduct = null;
let selectedImageData = "";

function $(id){
  return document.getElementById(id);
}

function money(value){
  return new Intl.NumberFormat("en-US",{
    maximumFractionDigits:0
  }).format(Number(value || 0));
}

function showToast(message){
  const el=$("toast");
  el.textContent=message;
  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2500);
}

function setMessage(id,message,type="error"){
  const el=$(id);

  if(!message){
    el.innerHTML="";
    return;
  }

  el.innerHTML=
    '<div class="message '+type+'">'+escapeHtml(message)+'</div>';
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function api(path,options={}){
  const headers={
    ...(options.headers || {})
  };

  const token=localStorage.getItem(TOKEN_KEY);

  if(token){
    headers.Authorization="Bearer "+token;
  }

  if(options.body && !headers["Content-Type"]){
    headers["Content-Type"]="application/json";
  }

  const response=await fetch(API_BASE+path,{
    ...options,
    headers
  });

  let data={};

  try{
    data=await response.json();
  }catch(e){}

  if(!response.ok){
    throw new Error(data.error || data.message || "Request failed");
  }

  return data;
}


/* AUTH */

async function login(){

  const email=$("loginEmail").value.trim();
  const password=$("loginPassword").value;

  if(!email || !password){
    setMessage("loginMsg","Email and password are required");
    return;
  }

  setMessage("loginMsg","Signing in...","success");

  try{

    const data=await api("/api/auth/login",{
      method:"POST",
      body:JSON.stringify({
        email,
        password
      })
    });

    localStorage.setItem(TOKEN_KEY,data.token);

    currentUser=data.user;

    $("loginScreen").classList.add("hidden");
    $("app").classList.remove("hidden");

    await loadUser();
    navigate("dashboard");

  }catch(error){

    setMessage("loginMsg",error.message);

  }
}


async function register(){

  const company=$("regCompany").value.trim();
  const name=$("regName").value.trim();
  const email=$("regEmail").value.trim();
  const password=$("regPassword").value;

  if(!company || !name || !email || !password){
    setMessage("registerMsg","Please complete all fields");
    return;
  }

  if(password.length<6){
    setMessage("registerMsg","Password must be at least 6 characters");
    return;
  }

  setMessage("registerMsg","Creating account...","success");

  try{

    const data=await api("/api/auth/register",{
      method:"POST",
      body:JSON.stringify({
        company,
        name,
        email,
        password
      })
    });

    localStorage.setItem(TOKEN_KEY,data.token);

    currentUser=data.user;

    closeRegister();

    $("loginScreen").classList.add("hidden");
    $("app").classList.remove("hidden");

    await loadUser();
    navigate("dashboard");

  }catch(error){

    setMessage("registerMsg",error.message);

  }
}


async function loadUser(){

  try{

    const data=await api("/api/auth/me");

    currentUser=data.user || data;

    const name=currentUser.name || "Owner";
    const company=
      currentUser.company_name ||
      currentUser.company ||
      "Aung Business";

    $("topUserName").textContent=name;
    $("topCompany").textContent=company;

    $("avatar").textContent=
      name.charAt(0).toUpperCase();

  }catch(error){

    logout();

  }
}


function showRegister(){
  $("registerModal").classList.remove("hidden");
}

function closeRegister(){
  $("registerModal").classList.add("hidden");
}


function logout(){

  localStorage.removeItem(TOKEN_KEY);

  currentUser=null;

  $("app").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
}


/* NAVIGATION */

function navigate(page,button){

  document.querySelectorAll(".nav-item")
    .forEach(x=>x.classList.remove("active"));

  if(button){
    button.classList.add("active");
  }

  closeSidebar();

  const pages={
    dashboard:renderDashboard,
    sales:renderSales,
    customers:renderCustomers,
    purchases:renderPurchases,
    inventory:renderInventory,
    accounting:renderAccounting,
    expenses:renderExpenses,
    employees:renderEmployees,
    users:renderUsers,
    growth:renderGrowth,
    coach:renderCoach,
    settings:renderSettings
  };

  if(pages[page]){
    pages[page]();
  }
}

async function loadProducts(){

  try{

    const data=await api("/api/products");

    productsCache=
      Array.isArray(data) ? data :
      Array.isArray(data.products) ? data.products :
      [];

    filterProducts();

  }catch(error){

    $("productGrid").innerHTML=
      `<div class="message error">${escapeHtml(error.message)}</div>`;

  }
}


function getImageMap(){

  try{
    return JSON.parse(
      localStorage.getItem(IMAGE_KEY) || "{}"
    );
  }catch(error){
    return {};
  }
}


function saveImageMap(map){

  localStorage.setItem(
    IMAGE_KEY,
    JSON.stringify(map)
  );

}


function productImage(product){

  const map=getImageMap();

  return map[product.id] || map[product.sku] || "";

}


function filterProducts(){

  const grid=$("productGrid");

  if(!grid)return;

  const input=$("productSearch");

  const query=
    input ?
    input.value.trim().toLowerCase() :
    "";

  const list=productsCache.filter(p=>{

    const text=[
      p.name,
      p.sku,
      p.category
    ].join(" ").toLowerCase();

    return text.includes(query);

  });

  if(!list.length){

    grid.innerHTML=`
      <div style="grid-column:1/-1;text-align:center;padding:40px;color:#6b7280">
        No products found
      </div>
    `;

    return;
  }

  grid.innerHTML=list.map(product=>{

    const image=productImage(product);

    const stock=Number(product.stock||0);
    const low=Number(product.low_stock||0);

    return `

      <div class="product-card">

        ${
          image
          ?
          `<img class="product-image" src="${image}" alt="">`
          :
          `<div class="product-image empty">📦</div>`
        }

        <div class="product-body">

          <div class="product-name">
            ${escapeHtml(product.name)}
          </div>

          <div class="product-sku">
            ${escapeHtml(product.sku || "No SKU")}
          </div>

          <div class="product-meta">

            <div class="product-price">
              ${money(product.selling_price)} MMK
            </div>

            <div class="stock ${stock<=low ? "low":""}">
              Stock ${money(stock)}
            </div>

          </div>

          <div style="margin-top:7px;font-size:12px;color:#6b7280">
            Cost: ${money(product.cost_price)} MMK
          </div>

          <div class="product-actions">

            <button
              class="btn btn-light"
              onclick="editProduct('${escapeHtml(product.id)}')"
            >
              Edit
            </button>

            <button
              class="btn btn-light"
              onclick="changeProductImage('${escapeHtml(product.id)}')"
            >
              🖼️ Image
            </button>

          </div>

        </div>

      </div>

    `;

  }).join("");
}


/* PRODUCT IMAGE */

function handleProductImage(event){

  const file=event.target.files[0];

  if(!file)return;

  if(!file.type.startsWith("image/")){
    showToast("Please select an image");
    return;
  }

  const reader=new FileReader();

  reader.onload=function(){

    const img=new Image();

    img.onload=function(){

      const maxSize=700;

      let width=img.width;
      let height=img.height;

      if(width>height){

        if(width>maxSize){
          height=Math.round(height*maxSize/width);
          width=maxSize;
        }

      }else{

        if(height>maxSize){
          width=Math.round(width*maxSize/height);
          height=maxSize;
        }

      }

      const canvas=document.createElement("canvas");

      canvas.width=width;
      canvas.height=height;

      const ctx=canvas.getContext("2d");

      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );

      selectedImageData=
        canvas.toDataURL(
          "image/jpeg",
          .72
        );

      showImagePreview(selectedImageData);

    };

    img.src=reader.result;

  };

  reader.readAsDataURL(file);
}


function showImagePreview(src){

  const box=$("imagePreviewBox");

  box.className="image-preview";

  box.innerHTML="";

  const img=document.createElement("img");

  img.src=src;

  img.style.width="100%";
  img.style.height="100%";
  img.style.objectFit="cover";
  img.style.borderRadius="14px";

  box.appendChild(img);

}


function openProductModal(product=null){

  editingProduct=product;
  selectedImageData=
    product ?
    productImage(product) :
    "";

  $("productModalTitle").textContent=
    product ? "Edit Product" : "Add Product";

  $("pName").value=product?.name || "";
  $("pSku").value=product?.sku || "";
  $("pCategory").value=product?.category || "";
  $("pUnit").value=product?.unit || "pcs";
  $("pCost").value=product?.cost_price ?? "";
  $("pPrice").value=product?.selling_price ?? "";
  $("pStock").value=product ? product.stock ?? 0 : "";
  $("pLowStock").value=product?.low_stock ?? 10;

  if(selectedImageData){
    showImagePreview(selectedImageData);
  }else{

    $("imagePreviewBox").className=
      "image-preview empty";

    $("imagePreviewBox").innerHTML="📦";

  }

  $("productImage").value="";

  $("productModal").classList.remove("hidden");
}


function closeProductModal(){

  $("productModal").classList.add("hidden");

  editingProduct=null;
  selectedImageData="";

}


function editProduct(id){

  const product=
    productsCache.find(
      p=>String(p.id)===String(id)
    );

  if(product){
    openProductModal(product);
  }

}


function changeProductImage(id){

  const product=
    productsCache.find(
      p=>String(p.id)===String(id)
    );

  if(!product)return;

  openProductModal(product);

  setTimeout(()=>{
    $("productImage").click();
  },150);

}


async function saveProduct(){

  const name=$("pName").value.trim();
  const sku=$("pSku").value.trim();
  const category=$("pCategory").value.trim();
  const unit=$("pUnit").value;
  const cost=Number($("pCost").value||0);
  const price=Number($("pPrice").value||0);
  const stock=Number($("pStock").value||0);
  const lowStock=Number($("pLowStock").value||0);

  if(!name){
    showToast("Product name is required");
    return;
  }

  if(price<0 || cost<0 || stock<0){
    showToast("Invalid product values");
    return;
  }

  try{

    const data=await api("/api/products",{
      method:"POST",
      body:JSON.stringify({
        name,
        sku:sku || null,
        category:category || null,
        unit,
        cost_price:cost,
        selling_price:price,
        opening_stock:editingProduct ? 0 : stock,
        low_stock:lowStock,
        active:true
      })
    });

    const saved=
      data.product ||
      data;

    const map=getImageMap();

    if(selectedImageData){

      const key=
        saved.id ||
        saved.sku ||
        editingProduct?.id;

      if(key){
        map[key]=selectedImageData;
      }

    }

    saveImageMap(map);

    closeProductModal();

    showToast(
      editingProduct
      ? "Product updated"
      : "Product saved"
    );

    await loadProducts();

  }catch(error){

    showToast(error.message);

  }
}
